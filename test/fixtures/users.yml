# Two users, so tests can check that one can't touch the other's tasks.
# Both passwords are "password123".

alice:
  email: alice@example.com
  username: alice
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  email_verified: true

bob:
  email: bob@example.com
  username: bob
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  email_verified: true
